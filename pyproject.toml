[project]
name = "llmops-rag-api"
version = "0.1.0"
description = "Cost-aware RAG API on Cloud Run with MLflow tracking"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Lets tests do `from app...` without installing the package.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 95
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/File() in defaults is the documented idiom.
